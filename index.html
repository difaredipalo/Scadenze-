
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scadenze + | Professional ERP</title>
    <meta name="description" content="Sistema di gestione professionale per monitorare scadenze di cantieri, personale, mezzi e documenti tecnici con calcolatore gare e analisi AI.">
    <meta property="og:title" content="Scadenze + | Professional ERP">
    <meta property="og:description" content="Sistema di gestione professionale per monitorare scadenze di cantieri, personale, mezzi e documenti tecnici con calcolatore gare e analisi AI.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Blocca lo scroll del body */
        }
        /* Scrollbar moderne, comode ed eleganti sia orizzontali che verticali */
        *::-webkit-scrollbar,
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        *::-webkit-scrollbar-track,
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        *::-webkit-scrollbar-thumb,
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: background-color 0.2s ease;
        }
        *::-webkit-scrollbar-thumb:hover,
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        .dark *::-webkit-scrollbar-thumb,
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        .dark *::-webkit-scrollbar-thumb:hover,
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        /* Rimuove le antiestetiche e scomode freccette predefinite native dei browser */
        *::-webkit-scrollbar-button,
        .custom-scrollbar::-webkit-scrollbar-button {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        *::-webkit-scrollbar-corner {
            background: transparent;
        }
        /* Supporto Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }
        .dark * {
            scrollbar-color: #334155 transparent;
        }
        /* 1. Campi con sfondo scuro (nel modulo POS, o con classi dark:bg-slate-* / bg-slate-800/900 / dark:text-white):
              il testo deve essere bianco nitido (#ffffff) con placeholder visibile */
        .pos-module input:not([type="checkbox"]):not([type="radio"]),
        .pos-module select,
        .pos-module textarea,
        .dark [data-pos-module] input:not([type="checkbox"]):not([type="radio"]),
        .dark [data-pos-module] select,
        .dark [data-pos-module] textarea,
        .dark .pos-scope input:not([type="checkbox"]):not([type="radio"]),
        .dark .pos-scope select,
        .dark .pos-scope textarea,
        .dark input.dark\:text-white,
        .dark select.dark\:text-white,
        .dark textarea.dark\:text-white,
        .dark input[class*="dark:bg-slate-"],
        .dark select[class*="dark:bg-slate-"],
        .dark textarea[class*="dark:bg-slate-"],
        .dark input[class*="bg-slate-800"],
        .dark select[class*="bg-slate-800"],
        .dark textarea[class*="bg-slate-800"],
        .dark input[class*="bg-slate-900"],
        .dark select[class*="bg-slate-900"],
        .dark textarea[class*="bg-slate-900"] {
            color: #ffffff !important;
        }

        .dark input[class*="dark:bg-slate-"]::placeholder,
        .dark textarea[class*="dark:bg-slate-"]::placeholder,
        .dark input[class*="bg-slate-800"]::placeholder,
        .dark textarea[class*="bg-slate-800"]::placeholder,
        .dark input[class*="bg-slate-900"]::placeholder,
        .dark textarea[class*="bg-slate-900"]::placeholder,
        .dark input.dark\:text-white::placeholder,
        .dark textarea.dark\:text-white::placeholder {
            color: #94a3b8 !important;
        }

        /* 2. RISOLUZIONE BIANCO SU BIANCO:
              Tutti i campi con sfondo chiaro (modali Nuovo Record, Modifica Cantiere, Dipendente, Mezzo, Documento, Tesserini Badge,
              form con bg-white, bg-slate-50 o text-slate-900/text-slate-800):
              IL TESTO DEVE ESSERE NERO/ARDESIA SCURO (#0f172a) E PERFETTAMENTE LEGGIBILE,
              anche se l'app è in modalità Dark! */
        input.bg-white,
        select.bg-white,
        textarea.bg-white,
        input.bg-slate-50,
        select.bg-slate-50,
        textarea.bg-slate-50,
        input[class*="text-slate-900"],
        select[class*="text-slate-900"],
        textarea[class*="text-slate-900"],
        input[class*="text-slate-800"],
        select[class*="text-slate-800"],
        textarea[class*="text-slate-800"],
        .bg-white input:not([class*="dark:bg-slate-"]):not([class*="bg-slate-800"]):not([class*="bg-slate-900"]):not(.dark\:text-white),
        .bg-white select:not([class*="dark:bg-slate-"]):not([class*="bg-slate-800"]):not([class*="bg-slate-900"]):not(.dark\:text-white),
        .bg-white textarea:not([class*="dark:bg-slate-"]):not([class*="bg-slate-800"]):not([class*="bg-slate-900"]):not(.dark\:text-white),
        .bg-slate-50 input:not([class*="dark:bg-slate-"]):not([class*="bg-slate-800"]):not([class*="bg-slate-900"]):not(.dark\:text-white),
        .bg-slate-50 select:not([class*="dark:bg-slate-"]):not([class*="bg-slate-800"]):not([class*="bg-slate-900"]):not(.dark\:text-white),
        .bg-slate-50 textarea:not([class*="dark:bg-slate-"]):not([class*="bg-slate-800"]):not([class*="bg-slate-900"]):not(.dark\:text-white),
        .dark input.bg-white:not([class*="dark:bg-slate-800"]):not([class*="dark:bg-slate-900"]):not(.dark\:text-white),
        .dark select.bg-white:not([class*="dark:bg-slate-800"]):not([class*="dark:bg-slate-900"]):not(.dark\:text-white),
        .dark textarea.bg-white:not([class*="dark:bg-slate-800"]):not([class*="dark:bg-slate-900"]):not(.dark\:text-white),
        .dark input[class*="text-slate-900"]:not([class*="dark:text-white"]),
        .dark select[class*="text-slate-900"]:not([class*="dark:text-white"]),
        .dark textarea[class*="text-slate-900"]:not([class*="dark:text-white"]),
        .dark input[class*="text-slate-800"]:not([class*="dark:text-white"]),
        .dark select[class*="text-slate-800"]:not([class*="dark:text-white"]),
        .dark textarea[class*="text-slate-800"]:not([class*="dark:text-white"]),
        .dark .bg-white input:not([class*="dark:bg-slate-"]):not([class*="bg-slate-800"]):not([class*="bg-slate-900"]):not(.dark\:text-white),
        .dark .bg-white select:not([class*="dark:bg-slate-"]):not([class*="bg-slate-800"]):not([class*="bg-slate-900"]):not(.dark\:text-white),
        .dark .bg-white textarea:not([class*="dark:bg-slate-"]):not([class*="bg-slate-800"]):not([class*="bg-slate-900"]):not(.dark\:text-white),
        .dark .bg-slate-50 input:not([class*="dark:bg-slate-"]):not([class*="bg-slate-800"]):not([class*="bg-slate-900"]):not(.dark\:text-white),
        .dark .bg-slate-50 select:not([class*="dark:bg-slate-"]):not([class*="bg-slate-800"]):not([class*="bg-slate-900"]):not(.dark\:text-white),
        .dark .bg-slate-50 textarea:not([class*="dark:bg-slate-"]):not([class*="bg-slate-800"]):not([class*="bg-slate-900"]):not(.dark\:text-white) {
            color: #0f172a !important;
        }

        /* Placeholder scuro e nitido sui campi chiari */
        .bg-white input::placeholder,
        .bg-white textarea::placeholder,
        .dark .bg-white input::placeholder,
        .dark .bg-white textarea::placeholder,
        .dark input.bg-white::placeholder,
        .dark textarea.bg-white::placeholder,
        input[class*="text-slate-900"]::placeholder,
        input[class*="text-slate-800"]::placeholder,
        .dark input[class*="text-slate-900"]::placeholder,
        .dark input[class*="text-slate-800"]::placeholder {
            color: #64748b !important;
        }

        /* Indicatori dei calendari nei campi data */
        .bg-white input[type="date"]::-webkit-calendar-picker-indicator,
        input.bg-white[type="date"]::-webkit-calendar-picker-indicator,
        .dark .bg-white input[type="date"]::-webkit-calendar-picker-indicator,
        .dark input.bg-white[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0) !important;
            opacity: 0.7;
        }
        .dark input[class*="dark:bg-slate-"][type="date"]::-webkit-calendar-picker-indicator,
        .dark input[class*="bg-slate-800"][type="date"]::-webkit-calendar-picker-indicator,
        .dark input[class*="bg-slate-900"][type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) !important;
            opacity: 0.8;
        }

        /* Opzioni select ad alto contrasto */
        select option {
            background-color: #ffffff !important;
            color: #0f172a !important;
        }
        .dark select[class*="dark:bg-slate-"] option,
        .dark select[class*="bg-slate-800"] option,
        .dark select[class*="bg-slate-900"] option {
            background-color: #0f172a !important;
            color: #ffffff !important;
        }
        @media print {
            body {
                overflow: visible !important;
                height: auto !important;
            }
            html {
                overflow: visible !important;
                height: auto !important;
            }
        }
    </style>
<script type="importmap">
{
